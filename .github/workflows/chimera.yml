name: chimera waterbox core

# The core as Chimera ships it: a sandboxed core.wbx package.
#
# Unlike consoles that need a bios dump, a GameCube boots homebrew with no
# firmware at all - and swiss (GPL) is committed under tests/roms. So a public
# runner proves the real thing: both flavors build, the machine runs, native
# and sandbox are byte-identical over RAM/video/audio/lag, savestates round-
# trip, input reaches the machine, and all three CPU cores hold - and the GPU
# leg draws on Mesa's llvmpipe. Only the commercial-disc legs SKIP here.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  core-gate:
    name: core gate (both flavors, tier 1 in full)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check out Chimera (for the miniBox waterbox host and toolchain)
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential cmake python3 pkg-config \
            libegl1 libgl1-mesa-dri libegl-mesa0

      - name: Check out miniBox
        working-directory: chimera-checkout
        run: git submodule update --init extern/tools/chimera-common-minibox

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/tools/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/tools/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/tools/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/tools/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/tools/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Cache the dolphin builds
        uses: actions/cache@v4
        with:
          path: |
            build/native
            build/guest
          key: dolphin-builds-${{ runner.os }}-${{ hashFiles('.gitmodules', 'patches/**', 'waterbox/configure-flags.sh', 'waterbox/guest-toolchain.cmake') }}

      - name: Build the native reference
        run: |
          export MINIBOX_SYSROOT="$PWD/chimera-checkout/extern/tools/chimera-common-minibox/build/meson-cpp/guest-sysroot"
          ./waterbox/build-native.sh
          make -C waterbox -f native.mk -j"$(nproc)" MB="$PWD/chimera-checkout/extern/tools/chimera-common-minibox"

      - name: Build the waterbox core
        run: |
          export MINIBOX_SYSROOT="$PWD/chimera-checkout/extern/tools/chimera-common-minibox/build/meson-cpp/guest-sysroot"
          ./waterbox/build-guest.sh
          MINIBOX_DIR="$PWD/chimera-checkout/extern/tools/chimera-common-minibox" \
            ./waterbox/build-core.sh -m "$PWD/chimera-checkout/extern/tools/chimera-common-minibox"

      - name: Core gate
        run: ./waterbox/run-gate.sh

      - name: Upload core.wbx
        uses: actions/upload-artifact@v7
        with:
          name: core-wbx
          path: |
            waterbox/bin/core.wbx
            waterbox/waterbox.config
          retention-days: 90

  frontend-gate:
    # The other half: the package running inside the real frontend (Chimera
    # headless under Mono and Xvfb, through the generic waterbox adapter). The
    # swiss leg and the keybinds leg run in full on a public runner; only the
    # commercial-disc legs SKIP.
    name: frontend gate (Chimera)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential cmake pkg-config python3 \
            mono-complete xvfb \
            libgl1-mesa-dev libx11-dev libxext-dev libasound2-dev \
            libegl1 libgl1-mesa-dri libegl-mesa0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Build Chimera native dependencies
        working-directory: chimera-checkout
        run: |
          meson setup build/meson-linux --prefix "$PWD/build" --libdir dll
          meson compile -C build/meson-linux
          meson install -C build/meson-linux

      - name: Build the Chimera solution
        working-directory: chimera-checkout
        run: dotnet build source/gui/Chimera.sln -c Release /nodeReuse:false -p:UseSharedCompilation=false

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/tools/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/tools/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/tools/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/tools/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/tools/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Cache the dolphin builds
        uses: actions/cache@v4
        with:
          path: build/guest
          key: dolphin-builds-${{ runner.os }}-${{ hashFiles('.gitmodules', 'patches/**', 'waterbox/configure-flags.sh', 'waterbox/guest-toolchain.cmake') }}

      - name: Build and install the waterbox core package
        # (No native flavor here: the frontend gate's reference is run-wbx,
        # which the core gate already holds byte-equal to the native build.)
        # The commit is the core's authoritative version: this build is the one
        # that publishes the artifact, so what it stamps is what a movie can
        # cite. A package built by hand stamps "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
          MINIBOX_SYSROOT: ${{ github.workspace }}/chimera-checkout/extern/tools/chimera-common-minibox/build/meson-cpp/guest-sysroot
        run: ./waterbox/build-package.sh -m "$PWD/chimera-checkout/extern/tools/chimera-common-minibox" -r "$PWD/chimera-checkout"

      - name: Frontend gate
        run: ./waterbox/tests/run-frontend.sh --chimera-root "$GITHUB_WORKSPACE/chimera-checkout"

      - name: Publish the core package
        uses: actions/upload-artifact@v7
        with:
          name: dolphin-${{ github.sha }}
          path: chimera-checkout/build/Cores/dolphin.chimeraCore
          if-no-files-found: error

      - name: Upload the frontend work dir on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-gate-work
          path: waterbox/tests/work/
